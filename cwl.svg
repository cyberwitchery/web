<!-- cyberwitchery mark. canonical geometry from decks/deck/beamerthemeCyberwitchery.sty (\cwlogo).
     256-unit box, stroke = size/16, square caps, miter joins. stroke uses currentColor so it
     stays recolourable / palette-aware like the TikZ original (cwInk #f4f4f4 on dark, #0b0b0b on light). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none"
     stroke="currentColor" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter">
  <path d="M128 24 L160 56 L128 88 L96 56 Z"/>
  <path d="M128 168 L160 200 L128 232 L96 200 Z"/>
  <path d="M128 88 L128 168"/>
  <path d="M44 128 L212 128"/>
